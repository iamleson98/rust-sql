[package]
name = "rustqlite-compat"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["rustqlite contributors"]
description = "SQLite C ABI compatibility layer for rustqlite: exports the real sqlite3_* symbols so unmodified sqlx / sea-orm / C programs link against the rustqlite engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/rustqlite"
keywords = ["database", "sql", "sqlite", "ffi", "sqlx"]
categories = ["database-implementations", "external-ffi-bindings"]

[lib]
# Produces `libsqlite3.so` (cdylib) and `libsqlite3.a` (staticlib) with the
# REAL `sqlite3_*` symbol names, plus an rlib for in-workspace Rust tests.
name = "sqlite3"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
rustqlite = { path = "../.." }
parking_lot = "0.12"

# This crate ships as `libsqlite3.so` — a library programs (and rustc's
# proc-macro host, via sqlx-macros) load with dlopen(). mimalloc's C
# thread-locals default to the initial-exec TLS model, which glibc can
# satisfy for a dlopen()ed library only from its small static-TLS surplus:
# once that ran out, loading failed with "cannot allocate memory in static
# TLS block" (the sqlx interop build on ubuntu). local-dynamic TLS is
# mimalloc's documented setting for dynamically loaded libraries. Feature
# unification applies it only to builds that include this crate; the
# engine's own builds keep initial-exec.
[target.'cfg(unix)'.dependencies]
libmimalloc-sys = { version = "0.1", features = ["local_dynamic_tls"] }

[features]
default = []
