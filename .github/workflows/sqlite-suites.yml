name: SQLite suites

# The compatibility-surface audits against SQLite's own public test
# corpora. The README's "Remaining gaps" numbers come from here.
#
# During the compatibility round this workflow doubles as the iteration
# loop: dispatch it with a filter to audit a slice of the corpus, read
# the per-file report artifact, fix, repeat. The schedule keeps the
# README numbers fresh (weekly, Mondays).

on:
  workflow_dispatch:
    inputs:
      slt_filter:
        description: "Substring filter on corpus file paths (empty = all)"
        required: false
        default: ""
      slt_strict:
        description: "1 = fail the job when any record fails"
        required: false
        default: "0"
      slt_maxfail:
        description: "Per-file failure details printed"
        required: false
        default: "5"
  schedule:
    - cron: "23 4 * * 1"

concurrency:
  group: sqlite-suites
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  slt-canonical:
    name: sqllogictest canonical corpus
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sqlite-suites-slt
          cache-on-failure: true

      - name: Fetch the canonical corpus (gregrahn/sqllogictest)
        run: |
          curl -sL --retry 3 -o /tmp/slt.tar.gz \
            https://codeload.github.com/gregrahn/sqllogictest/tar.gz/refs/heads/master
          tar xzf /tmp/slt.tar.gz -C "$RUNNER_TEMP"
          rm -f /tmp/slt.tar.gz
          echo "corpus at: $RUNNER_TEMP/sqllogictest-master/test"
          du -sh "$RUNNER_TEMP/sqllogictest-master/test"

      - name: Run the SLT canonical audit
        env:
          SLT_DIR: ${{ runner.temp }}/sqllogictest-master/test
          SLT_FILTER: ${{ github.event.inputs.slt_filter || '' }}
          SLT_STRICT: ${{ github.event.inputs.slt_strict || '0' }}
          SLT_MAXFAIL: ${{ github.event.inputs.slt_maxfail || '5' }}
        run: |
          set -o pipefail
          cargo test --release --test slt_canonical -- --ignored --nocapture \
            2>&1 | tee slt_report.log

      - name: The tally (job summary)
        if: always()
        run: |
          {
            echo "# sqllogictest canonical audit"
            echo '```'
            grep -E "^slt (PASS|FAIL)|^slt_canonical:" slt_report.log | tail -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          tail -1 slt_report.log

      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slt-canonical-report
          path: slt_report.log
          if-no-files-found: warn
