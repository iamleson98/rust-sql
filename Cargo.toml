[package]
name = "rustqlite"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["rustqlite contributors"]
description = "A from-scratch embedded SQL database in pure Rust, inspired by SQLite"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/rustqlite"
keywords = ["database", "sql", "sqlite", "embedded", "btree"]
categories = ["database-implementations"]

[workspace]
members = ["compat/rustqlite-compat"]
# `compat/libsqlite3-sys` is consumed via [patch.crates-io] from the
# CONSUMER's workspace — building it here as a member would emit link flags
# for every workspace command. It stays out of the default member set.
# `sqlx-interop` is a SEPARATE workspace: it pulls unmodified crates.io
# sqlx 0.9 + sea-orm 2.0 and patches libsqlite3-sys to the rustqlite
# compat layer — a workspace cannot [patch] a crate it also contains as
# a path dependency of a member, so it stays self-contained.
# Run: cd sqlx-interop && RUSTQLITE_LIB_DIR=../target/release cargo run --release
# `plugins/rust` is a standalone example cdylib built by tests/build_plugins.sh
# against the raw C ABI (no engine linkage) — excluded so `cargo build` inside
# its directory does not collide with this workspace.
exclude = ["compat/libsqlite3-sys", "sqlx-interop", "plugins/rust"]

[lib]
name = "rustqlite"
path = "src/lib.rs"

[[bin]]
name = "rustqlite-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "rustqlite-server"
path = "src/bin/server.rs"

[[example]]
name = "bench_vs_sqlite"
path = "examples/bench_vs_sqlite.rs"

# Phase profile of the multi-VALUES INSERT path (parse/plan/exec split).
[[example]]
name = "probe_mv_insert"
path = "examples/probe_mv_insert.rs"

# Per-iteration breakdown of the multi-VALUES bench shape for both engines.
[[example]]
name = "probe_mv_breakdown"
path = "examples/probe_mv_breakdown.rs"

# open_in_memory() cost breakdown (tempfile vs open vs first statements).
[[example]]
name = "probe_open_cost"
path = "examples/probe_open_cost.rs"

# Scan-cost isolation: walk vs decode vs materialize (pinned + unpinned).
[[example]]
name = "probe_scan_cost"
path = "examples/probe_scan_cost.rs"

# sqlx driver-vs-driver benchmark: native rustqlite driver vs sqlx-sqlite
# (C SQLite) through the identical sqlx API.
# Run: cargo run --release --example bench_sqlx_native --features sqlx
[[example]]
name = "bench_sqlx_native"
path = "examples/bench_sqlx_native.rs"
required-features = ["sqlx"]

# Concurrency probes need the native sqlx driver (Pool API).
# Run: cargo run --release --example probe_conc_cost --features sqlx
[[example]]
name = "probe_conc_cost"
path = "examples/probe_conc_cost.rs"
required-features = ["sqlx"]

# Dirty-read probe: WAL snapshots + writer gate vs read-uncommitted.
# Run: cargo run --release --example probe_dirty_read --features sqlx
[[example]]
name = "probe_dirty_read"
path = "examples/probe_dirty_read.rs"
required-features = ["sqlx"]

# 7-writers/1-reader stress probe through the sqlx Pool.
# Run: cargo run --release --example probe_w7r --features sqlx
[[example]]
name = "probe_w7r"
path = "examples/probe_w7r.rs"
required-features = ["sqlx"]

[dependencies]
# HTTP server (tiny, no async runtime — keeps binary size small)
tiny_http = "0.12"
# CRC32 for WAL checksums (SIMD-accelerated, tiny)
crc32fast = "1.4"
# CLI readline (optional — falls back to stdin if not present)
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
# Temp file for in-memory mode (always needed by api.rs)
tempfile = "3"
# Fast Mutex/RwLock (much faster than std::sync — futex-based, never poisoned).
# Used by Pager cache (Arc<Mutex<Page>>) so Database becomes Send+Sync,
# enabling true concurrent reads via Arc<RwLock<Database>>.
parking_lot = "0.12"
# Fast general-purpose allocator. The engine is allocation-intensive on hot
# paths (row Vecs, statement ASTs, key buffers); mimalloc's thread-local
# heaps cut small-allocation cost by 20-40% vs the system malloc, which
# shows up directly in scan/insert/join throughput. Optional — opt out
# with `default-features = false`.
mimalloc = { version = "0.1", optional = true }
# Raw FFI for the mimalloc option API (purge-delay tuning); version-locked
# to whatever `mimalloc` resolves to (same upstream).
libmimalloc-sys = { version = "0.1", optional = true, features = ["extended"] }
# Dynamic extension loading (dlopen for C/C++/Zig/Rust .so plugins).
# Optional: disable with `default-features = false` for a hardened build
# (mirrors SQLite's SQLITE_OMIT_LOAD_EXTENSION).
libloading = { version = "0.8", optional = true }
# --- Native sqlx driver (feature `sqlx`) -------------------------------
# sqlx-core's driver traits, implemented directly against the engine —
# sqlx works with rustqlite as a plain Rust crate dependency: no C ABI,
# no libsqlite3.so, no [patch.crates-io]. Version-pinned to match the
# `sqlx` 0.9 facade exactly (sqlx-sqlite pins `=0.9.0`; a mismatch would
# create two sqlx-core copies and break type identity).
sqlx-core = { version = "=0.9.0", default-features = false, optional = true }
futures-core = { version = "0.3", default-features = false, optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
rand = "0.8"
# For tests/sqlx_driver.rs: the real sqlx facade + a runtime (proves
# facade/driver type identity through the public API users actually use).
# It also provides `sqlx-core/_rt-tokio` for pool timers in test builds.
# `sqlite-unbundled` links the SYSTEM C SQLite so
# examples/bench_sqlx_native.rs can compare the native driver against the
# real sqlx-sqlite through the identical API (worker thread + FFI).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "derive", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["mimalloc", "extension"]
# SQLite's SQLITE_MEMDEBUG/memsys2 equivalent: replace the global allocator
# with a counting allocator that can fail at allocation #N. Enables the
# `oom_fault` test (see tests/oom_fault.rs) and disables mimalloc for that
# build (only one global allocator may exist per binary).
oom-injection = []
# Fast global allocator (see the mimalloc dependency note above).
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
extension = ["dep:libloading"]
# Disable to remove rustyline (smaller binary)
no-cli-readline = []
# Native sqlx driver: `Pool<Rustqlite>`, `query()`, transactions, ... see
# `src/sqlx_driver`. (The `sqlx` facade crate in YOUR app should enable a
# runtime feature, e.g. `runtime-tokio`, which also provides the async
# timers sqlx-core's pool uses.)
sqlx = ["dep:sqlx-core", "dep:futures-core", "dep:futures-util", "dep:log"]

# Crash/power-loss simulation (SQLite testing.html §3.3): spawns itself as
# a child that hard-aborts mid-transaction at advancing statement
# boundaries, then verifies all-or-nothing + baseline survival.
[[test]]
name = "crash_recovery"
path = "tests/crash_recovery.rs"
harness = false

# OOM fault injection (SQLite testing.html §3.1): a counting global
# allocator that fails at allocation #N; the parent advances N through the
# whole workload allocation range and verifies the baseline after each.
[[test]]
name = "oom_fault"
path = "tests/oom_fault.rs"
harness = false
required-features = ["oom-injection"]

[[bench]]
name = "point_lookup"
harness = false

[[bench]]
name = "range_scan"
harness = false

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "join"
harness = false

[[bench]]
name = "sqlite_comparison"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
